name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android build, unit tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Validates the wrapper checksum and caches Gradle dependencies.
      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      # Uploads are best-effort: a full Actions storage quota must not fail an otherwise green build.
      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  agent-runtime:
    name: Agent runtime tests and bundle check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check bundled assets are up to date
        working-directory: .
        run: |
          if ! git diff --exit-code --stat -- app/src/main/assets/agent; then
            echo "::error::app/src/main/assets/agent is stale. Run 'npm run build' in agent-runtime and commit the result."
            exit 1
          fi
